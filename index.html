<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>罗家通书 · 乾坤黄历</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <style>
        :root {
            --bg-color: #f7f4ed;
            --card-bg: #ffffff;
            --main-red: #b81c22;
            --main-green: #2e7d32;
            --text-color: #2c2c2c;
            --border-color: #e0dacf;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--main-red);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 20px;
            color: var(--main-red);
            margin: 0;
            letter-spacing: 2px;
        }

        .date-box {
            text-align: center;
            background: #fdfaf5;
            border: 1px dashed #d1c7b7;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .gongli {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }

        .nongli {
            font-size: 28px;
            font-weight: bold;
            color: var(--main-red);
            margin: 6px 0;
        }

        .ganzhi {
            font-size: 14px;
            color: #444;
            font-weight: 500;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            background: #faf8f5;
            padding: 10px;
            border-radius: 8px;
        }

        .yiji-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .yi-box, .ji-box {
            padding: 12px;
            border-radius: 10px;
        }

        .yi-box {
            background-color: rgba(46, 125, 50, 0.08);
            border: 1px solid rgba(46, 125, 50, 0.2);
        }

        .ji-box {
            background-color: rgba(184, 28, 34, 0.08);
            border: 1px solid rgba(184, 28, 34, 0.2);
        }

        .title-yi { color: var(--main-green); font-weight: bold; font-size: 15px; margin-bottom: 6px; }
        .title-ji { color: var(--main-red); font-weight: bold; font-size: 15px; margin-bottom: 6px; }

        .content-text { font-size: 13px; line-height: 1.6; color: #333; }

        .zhenyan-box {
            background: #f4efeb;
            border-left: 4px solid var(--main-red);
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #555;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📜 罗家通书 · 乾坤黄历</h1>
    </div>

    <div class="date-box">
        <div class="gongli" id="gongli-text">loading...</div>
        <div class="nongli" id="nongli-text">loading...</div>
        <div class="ganzhi" id="ganzhi-text">loading...</div>
    </div>

    <div class="details-grid">
        <div>五行：<span id="nayin">-</span></div>
        <div>建除：<span id="jianshen">-</span></div>
        <div>冲煞：<span id="chongsha">-</span></div>
        <div>星宿：<span id="xingxiu">-</span></div>
    </div>

    <div class="yiji-container">
        <div class="yi-box">
            <div class="title-yi">【 宜 】</div>
            <div class="content-text" id="yi-text">-</div>
        </div>
        <div class="ji-box">
            <div class="title-ji">【 忌 】</div>
            <div class="content-text" id="ji-text">-</div>
        </div>
    </div>

    <div class="zhenyan-box">
        📖 <strong>《通书》箴言：</strong><br>
        <span id="zhenyan-text">卯不穿井，水泉不香；己不破券，二主分张。</span>
    </div>
</div>

<script>
    // 渲染老黄历数据
    function renderHuangli() {
        const d = new Date();
        const lunar = Lunar.fromDate(d);

        // 公历
        document.getElementById('gongli-text').innerText = 
            `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 星期${lunar.getWeekInChinese()}`;
        
        // 农历
        document.getElementById('nongli-text').innerText = 
            `农历 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
        
        // 干支
        document.getElementById('ganzhi-text').innerText = 
            `岁次 ${lunar.getYearInGanZhi()}（${lunar.getYearShengXiao()}）年 ${lunar.getMonthInGanZhi()}月 ${lunar.getDayInGanZhi()}日`;

        // 细节
        document.getElementById('nayin').innerText = lunar.getDayNaYin();
        document.getElementById('jianshen').innerText = lunar.getJianShen() + '位';
        document.getElementById('chongsha').innerText = `冲${lunar.getDayChongShengXiao()} 煞${lunar.getDaySha()}`;
        document.getElementById('xingxiu').innerText = `${lunar.getXiu()}${lunar.getAnimal()}`;

        // 宜忌
        const yiList = lunar.getDayYi();
        const jiList = lunar.getDayJi();
        document.getElementById('yi-text').innerHTML = yiList.length ? yiList.slice(0, 6).join('<br>') : '诸事不宜';
        document.getElementById('ji-text').innerHTML = jiList.length ? jiList.slice(0, 6).join('<br>') : '无特别禁忌';
    }

    // 页面加载完成后运行
    window.onload = renderHuangli;
</script>

</body>
</html>
