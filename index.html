<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>罗家通书 · 乾坤历书</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <style>
        :root {
            --bg-color: #f4efe6;
            --card-bg: #fffcf7;
            --border-red: #a81c1c;
            --text-black: #1a1a1a;
            --text-red: #a81c1c;
            --text-gray: #555555;
            --green-color: #1b7a38;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-black);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .tongshu-page {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 3px double var(--border-red);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--border-red);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--text-red);
            letter-spacing: 3px;
            font-weight: bold;
        }
        .header .sub {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        .date-section {
            border: 1px solid var(--border-red);
            background: #fff8f0;
            padding: 10px;
            text-align: center;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .gongli-row { font-size: 13px; color: var(--text-gray); }
        .nongli-main { font-size: 28px; color: var(--text-red); font-weight: bold; margin: 4px 0; }
        .ganzhi-row { font-size: 14px; font-weight: bold; color: var(--text-black); }

        .section-box {
            border: 1px solid #d0c4b0;
            margin-bottom: 8px;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
        }
        .sec-title {
            background: var(--border-red);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            padding: 4px 8px;
            letter-spacing: 1px;
        }
        .sec-content {
            padding: 8px;
            font-size: 12px;
            line-height: 1.6;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; text-align: center; }

        .yiji-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .yi-box { border: 1px solid var(--green-color); background: rgba(27, 122, 56, 0.05); border-radius: 4px; }
        .ji-box { border: 1px solid var(--border-red); background: rgba(168, 28, 28, 0.05); border-radius: 4px; }
        .yi-header { background: var(--green-color); color: white; padding: 3px 6px; font-size: 13px; font-weight: bold; }
        .ji-header { background: var(--border-red); color: white; padding: 3px 6px; font-size: 13px; font-weight: bold; }
        .yiji-list { padding: 6px; font-size: 12px; line-height: 1.6; color: #222; }

        .shichen-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: center;
        }
        .shichen-table th {
            background: #eae2d3;
            border: 1px solid #c5b8a0;
            padding: 4px 2px;
            color: var(--text-black);
        }
        .shichen-table td {
            border: 1px solid #e0d5c1;
            padding: 4px 2px;
        }
        .ji-tag { color: var(--green-color); font-weight: bold; }
        .xiong-tag { color: var(--text-red); font-weight: bold; }

        .picker-bar {
            margin-bottom: 10px;
            text-align: center;
        }
        .picker-bar input {
            padding: 4px 8px;
            border: 1px solid var(--border-red);
            border-radius: 4px;
            background: #fff;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="tongshu-page">
    <div class="header">
        <h1>羅家通書 · 廣經堂</h1>
        <div class="sub">【包罗万象 · 择日择吉 · 趋吉避凶】</div>
    </div>

    <div class="picker-bar">
        <label for="date-select" style="font-size:12px;">📅 选择日期：</label>
        <input type="date" id="date-select" onchange="loadDate(this.value)">
    </div>

    <div class="date-section">
        <div class="gongli-row" id="gongli-str">加载中...</div>
        <div class="nongli-main" id="nongli-str">加载中...</div>
        <div class="ganzhi-row" id="ganzhi-str">加载中...</div>
    </div>

    <div class="section-box">
        <div class="sec-title">☯️ 岁煞神煞 / 建除星宿</div>
        <div class="sec-content grid-2">
            <div>五行纳音：<b id="nayin">-</b></div>
            <div>建除十二神：<b id="jianshen" style="color:var(--text-red);">-</b></div>
            <div>二十八宿：<b id="star">-</b></div>
            <div>冲煞：<b id="chongsha" style="color:var(--text-red);">-</b></div>
        </div>
    </div>

    <div class="section-box">
        <div class="sec-title">🧭 每日吉神方位与胎神</div>
        <div class="sec-content">
            <div class="grid-3">
                <div>喜神：<b id="pos-xi" style="color:var(--text-red);">-</b></div>
                <div>福神：<b id="pos-fu">-</b></div>
                <div>财神：<b id="pos-cai" style="color:var(--green-color);">-</b></div>
            </div>
            <div style="border-top:1px dashed #ccc; margin-top:6px; padding-top:4px; color:#a81c1c;">
                👶 <b>今日胎神占方：</b><span id="taishen">-</span>
            </div>
        </div>
    </div>

    <div class="section-box">
        <div class="sec-title">⚠️ 彭祖百忌</div>
        <div class="sec-content" id="pengzu" style="color:var(--text-red); font-weight:bold;">
            -
        </div>
    </div>

    <div class="yiji-grid">
        <div class="yi-box">
            <div class="yi-header">【 宜 】</div>
            <div class="yiji-list" id="yi-list">-</div>
        </div>
        <div class="ji-box">
            <div class="ji-header">【 忌 】</div>
            <div class="yiji-list" id="ji-list">-</div>
        </div>
    </div>

    <div class="section-box">
        <div class="sec-title">✨ 吉神宜趋与凶煞宜忌</div>
        <div class="sec-content grid-2">
            <div><b>吉神宜趋：</b><br><span id="jishen" style="color:var(--green-color);">-</span></div>
            <div><b>凶神宜忌：</b><br><span id="xionshen" style="color:var(--text-red);">-</span></div>
        </div>
    </div>

    <div class="section-box">
        <div class="sec-title">⏰ 十二时辰吉凶细表</div>
        <div style="overflow-x:auto;">
            <table class="shichen-table">
                <thead>
                    <tr>
                        <th>时辰</th>
                        <th>干支</th>
                        <th>吉凶</th>
                        <th>冲煞</th>
                        <th>宜</th>
                        <th>忌</th>
                    </tr>
                </thead>
                <tbody id="shichen-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 安全取值工具
    function getSafe(fn, defaultVal = '-') {
        try {
            const res = fn();
            return (res !== undefined && res !== null && res !== '') ? res : defaultVal;
        } catch (e) {
            return defaultVal;
        }
    }

    // 渲染老黄历
    function renderTongshu(targetDate) {
        const d = targetDate || new Date();
        if (typeof Lunar === 'undefined') {
            document.getElementById('gongli-str').innerText = "算法库加载中，请稍后刷新...";
            return;
        }
        
        const lunar = Lunar.fromDate(d);

        // 1. 公农历与干支
        document.getElementById('gongli-str').innerText = 
            `公历：${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 星期${getSafe(() => lunar.getWeekInChinese())}`;
        
        document.getElementById('nongli-str').innerText = 
            `农历 ${getSafe(() => lunar.getMonthInChinese())}月 ${getSafe(() => lunar.getDayInChinese())}`;
            
        document.getElementById('ganzhi-str').innerText = 
            `岁次：${getSafe(() => lunar.getYearInGanZhi())}（${getSafe(() => lunar.getYearShengXiao())}）年 ${getSafe(() => lunar.getMonthInGanZhi())}月 ${getSafe(() => lunar.getDayInGanZhi())}日`;

        // 2. 建除十二神（修正为 getZhiXing()）
        document.getElementById('nayin').innerText = getSafe(() => lunar.getDayNaYin());
        document.getElementById('jianshen').innerText = getSafe(() => lunar.getZhiXing() + '日', '平日');
        document.getElementById('star').innerText = getSafe(() => `${lunar.getXiu()}${lunar.getAnimal()}`);
        document.getElementById('chongsha').innerText = getSafe(() => `冲${lunar.getDayChongShengXiao()} 煞${lunar.getDaySha()}`);

        // 3. 方位
        document.getElementById('pos-xi').innerText = getSafe(() => lunar.getDayPositionXiDesc());
        document.getElementById('pos-fu').innerText = getSafe(() => lunar.getDayPositionFuDesc());
        document.getElementById('pos-cai').innerText = getSafe(() => lunar.getDayPositionCaiDesc());
        document.getElementById('taishen').innerText = getSafe(() => lunar.getDayPositionTai());

        // 4. 彭祖百忌
        document.getElementById('pengzu').innerHTML = getSafe(() => `${lunar.getPengZuGan()}<br>${lunar.getPengZuZhi()}`);

        // 5. 宜忌
        const yi = getSafe(() => lunar.getDayYi(), []);
        const ji = getSafe(() => lunar.getDayJi(), []);
        document.getElementById('yi-list').innerHTML = (Array.isArray(yi) && yi.length) ? yi.join(' · ') : '诸事不宜';
        document.getElementById('ji-list').innerHTML = (Array.isArray(ji) && ji.length) ? ji.join(' · ') : '诸事无忌';

        // 6. 神煞
        const jishen = getSafe(() => lunar.getDayJiShen(), []);
        const xionshen = getSafe(() => lunar.getDayXiongSha(), []);
        document.getElementById('jishen').innerText = (Array.isArray(jishen) && jishen.length) ? jishen.join(' ') : '无';
        document.getElementById('xionshen').innerText = (Array.isArray(xionshen) && xionshen.length) ? xionshen.join(' ') : '无';

        // 7. 十二时辰（修正为 getZhi() 获取地支）
        const times = getSafe(() => lunar.getTimes(), []);
        let html = '';
        if (Array.isArray(times) && times.length) {
            times.forEach(t => {
                const luck = getSafe(() => t.getTianShenLuck(), '平');
                const luckClass = luck === '吉' ? 'ji-tag' : (luck === '凶' ? 'xiong-tag' : '');
                const tYi = getSafe(() => t.getYi(), []);
                const tJi = getSafe(() => t.getJi(), []);
                const yiStr = (Array.isArray(tYi) && tYi.length) ? tYi.slice(0, 2).join(',') : '无';
                const jiStr = (Array.isArray(tJi) && tJi.length) ? tJi.slice(0, 2).join(',') : '无';

                html += `<tr>
                    <td><b>${getSafe(() => t.getZhi())}时</b></td>
                    <td>${getSafe(() => t.getGanZhi())}</td>
                    <td class="${luckClass}">${getSafe(() => t.getTianShen())} (${luck})</td>
                    <td>冲${getSafe(() => t.getChongShengXiao())}</td>
                    <td style="color:var(--green-color);">${yiStr}</td>
                    <td style="color:var(--text-red);">${jiStr}</td>
                </tr>`;
            });
        }
        document.getElementById('shichen-body').innerHTML = html;
    }

    function loadDate(dateStr) {
        if (!dateStr) return;
        const parts = dateStr.split('-');
        const target = new Date(parts[0], parts[1] - 1, parts[2]);
        renderTongshu(target);
    }

    window.onload = function() {
        const today = new Date();
        document.getElementById('date-select').value = today.toISOString().split('T')[0];
        renderTongshu(today);
    };
</script>

</body>
</html>
